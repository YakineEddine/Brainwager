name: brainwager
description: "Brainwager — Bet on what you know / Parie sur ce que tu sais. Party trivia game multijoueur festif, 100% original."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  app_links: ^7.2.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
    - assets/branding/
